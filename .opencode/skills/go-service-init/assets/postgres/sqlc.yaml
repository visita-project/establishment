version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/infra/storage/postgres/queries/"
    gen:
      go:
        package: "sqlc"
        out: "gen/sqlc"
        sql_package: "pgx/v5"
        sql_driver: github.com/jackc/pgx/v5
        emit_pointers_for_null_types: true

overrides:
  go:
    overrides:
      - db_type: pg_catalog.int4
        nullable: true
        go_type:
          type: int
          pointer: true
      - db_type: pg_catalog.int4
        nullable: false
        go_type:
          type: int
          pointer: false
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: timestamptz
        nullable: false
        go_type:
          import: time
          type: Time
          pointer: false
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: uuid
        nullable: false
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: false
      - db_type: date
        nullable: false
        go_type:
          import: time
          type: Time
          pointer: false
      - db_type: date
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
